buildscript {
	dependencies {
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.source.formatter", version: "latest.release"
	}
	repositories {
		mavenCentral()
	}
}


apply plugin: "com.liferay.spring.boot.defaults"
apply plugin: "io.spring.dependency-management"
apply plugin: "com.liferay.source.formatter"
apply plugin: "java"

bootJar {
	classifier = "application"
}

dependencies {
	compile group: "commons-logging", name: "commons-logging", version: "1.2"
	compile group: "org.json", name: "json", version: "20180813"
	compile group: "org.springframework.boot", name: "spring-boot-starter-web"
	compile group: "com.liferay", name: "com.liferay.digital.signature.rest.client", version: "1.0.2"
	compile group: "com.liferay", name: "com.liferay.headless.delivery.client", version: "4.0.9"
	compile group: "com.liferay", name: "com.liferay.document.library.api", version: "6.4.9"
	compile group: "com.liferay", name: "com.liferay.document.library.service", version: "6.0.8"
	compile group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.5.0"
	compile group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "9.9.0"
	compile group: "com.liferay.portal", name: "com.liferay.util.java", version: "7.0.0"
	compile group: "org.apache.commons.io", name: "commonsIO", version: "2.5.0"

}

jar {
	enabled = true
}

repositories {
	mavenCentral()
}