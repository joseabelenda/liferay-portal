assemble:
    - fromTask: bootJar
liferay-lms-etc-spring-boot-oauth-application-headless-server:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay LMS Etc Spring Boot OAuth Application Headless Server
    scopes:
        - Liferay.Headless.Admin.User.everything
        - Liferay.Headless.Admin.Workflow.everything
        - c_course.everything
    type: oAuthApplicationHeadlessServer
liferay-lms-etc-spring-boot-oauth-application-user-agent:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay LMS Etc Spring Boot OAuth Application User Agent
    scopes:
        - Liferay.Headless.Admin.User.read
        - c_course.read
    type: oAuthApplicationUserAgent